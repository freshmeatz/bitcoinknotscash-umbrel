version: "3.7"

# Bitcoin Knots Cash (xBTC) full node for umbrelOS.
# Based on the upstream umbrel-xbtc compose, with two things fixed so it actually
# works (see the Dockerfile and README for the why):
#   1. image: the Cash-binary image built from this repo (not the BTC one).
#   2. BITCOIND_EXTRA_ARGS: all RPC/P2P settings are forced on the command line,
#      because the Cash binary IGNORES the generated umbrel-bitcoin.conf (both the
#      [main] section AND global rpcauth/rpcbind/rpcallowip). Without this, RPC binds
#      only to 127.0.0.1 and rejects every credential, so no other app (mempool,
#      electrs, DATUM) can reach it.

services:
  app_proxy:
    environment:
      APP_HOST: $APP_XBTC_NODE_NODE_IP
      APP_PORT: 3000
    container_name: xbtc-node_app_proxy_1

  app:
    # Built by .github/workflows/build-images.yml from ./xbtc-node/Dockerfile.
    image: ghcr.io/freshmeatz/umbrel-xbtc-cash:v0.2.2-xbtc
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 15m30s
    ports:
      - ${APP_XBTC_NODE_P2P_PORT}:${APP_XBTC_NODE_P2P_PORT}
      - ${APP_XBTC_NODE_RPC_PORT}:${APP_XBTC_NODE_RPC_PORT}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      # The Cash binary ignores the included conf, so everything goes here.
      BITCOIND_EXTRA_ARGS: >-
        -deprecatedrpc=create_bdb,-addnode=46.7.6.219:8555,-addnode=5.9.134.214:8555,-dnsseed=0,-port=${APP_XBTC_NODE_P2P_PORT},-bind=0.0.0.0:${APP_XBTC_NODE_P2P_PORT},-whitebind=0.0.0.0:${APP_XBTC_NODE_P2P_WHITEBIND_PORT},-bind=${APP_XBTC_NODE_NODE_IP}:${APP_XBTC_NODE_TOR_PORT}=onion,-rpcport=${APP_XBTC_NODE_RPC_PORT},-rpcbind=0.0.0.0,-rpcallowip=10.21.0.0/16,-rpcuser=${APP_XBTC_NODE_RPC_USER},-rpcpassword=${APP_XBTC_NODE_RPC_PASS}
      APPS_SUBNET: ${NETWORK_IP}/16
      P2P_PORT: ${APP_XBTC_NODE_P2P_PORT}
      P2P_WHITEBIND_PORT: ${APP_XBTC_NODE_P2P_WHITEBIND_PORT}
      RPC_PORT: ${APP_XBTC_NODE_RPC_PORT}
      TOR_PORT: ${APP_XBTC_NODE_TOR_PORT}
      ZMQ_RAWBLOCK_PORT: ${APP_XBTC_NODE_ZMQ_RAWBLOCK_PORT}
      ZMQ_RAWTX_PORT: ${APP_XBTC_NODE_ZMQ_RAWTX_PORT}
      ZMQ_HASHBLOCK_PORT: ${APP_XBTC_NODE_ZMQ_HASHBLOCK_PORT}
      ZMQ_SEQUENCE_PORT: ${APP_XBTC_NODE_ZMQ_SEQUENCE_PORT}
      ZMQ_HASHTX_PORT: ${APP_XBTC_NODE_ZMQ_HASHTX_PORT}
      TOR_HOST: ${APP_XBTC_NODE_TOR_PROXY_IP}
      TOR_SOCKS_PORT: "9050"
      TOR_CONTROL_PORT: "9051"
      TOR_CONTROL_PASSWORD: moneyprintergobrrr
      I2P_HOST: ${APP_XBTC_NODE_I2P_DAEMON_IP}
      I2P_SAM_PORT: "7656"
      BITCOIND_IP: ${APP_XBTC_NODE_NODE_IP}
      RPC_USER: ${APP_XBTC_NODE_RPC_USER}
      RPC_PASS: ${APP_XBTC_NODE_RPC_PASS}
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME}
      P2P_HIDDEN_SERVICE: ${APP_XBTC_NODE_P2P_HIDDEN_SERVICE}
      RPC_HIDDEN_SERVICE: ${APP_XBTC_NODE_RPC_HIDDEN_SERVICE}
    networks:
      default:
        ipv4_address: $APP_XBTC_NODE_NODE_IP
    container_name: xbtc-node_app_1

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: /tmp
    networks:
      default:
        ipv4_address: ${APP_XBTC_NODE_TOR_PROXY_IP}
    container_name: xbtc-node_tor_1

  i2pd_daemon:
    image: purplei2p/i2pd:release-2.59.0@sha256:257653c18ce0b127ef480e3d8373b3ddbf1495e842674c8cfc59909be0015979
    user: root
    command: "--sam.enabled=true --sam.address=0.0.0.0 --sam.port=7656 --loglevel=error"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/i2pd:/home/i2pd/data
    networks:
      default:
        ipv4_address: ${APP_XBTC_NODE_I2P_DAEMON_IP}
    container_name: xbtc-node_i2pd_daemon_1
