name: Build xBTC node image

# Builds the Bitcoin Knots Cash node image (Cash binaries overlaid on the umbrel
# scaffolding) and pushes it to GHCR, so the xbtc-node app's docker-compose can pull it.
# Trigger manually, or on changes to the node Dockerfile.

on:
  workflow_dispatch:
    inputs:
      xbtc_release:
        description: "BitcoinKnotsCash release tag to bundle"
        default: "v0.2.2-xbtc"
      tag:
        description: "Image tag to push"
        default: "v0.2.2-xbtc"
  push:
    paths:
      - "xbtc-node/Dockerfile"
      - ".github/workflows/build-images.yml"

jobs:
  build-xbtc-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./xbtc-node
          file: ./xbtc-node/Dockerfile
          push: true
          build-args: |
            XBTC_RELEASE=${{ github.event.inputs.xbtc_release || 'v0.2.2-xbtc' }}
          tags: ghcr.io/${{ github.repository_owner }}/umbrel-xbtc-cash:${{ github.event.inputs.tag || 'v0.2.2-xbtc' }}
