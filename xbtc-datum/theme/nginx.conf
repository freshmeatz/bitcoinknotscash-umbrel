# Crypto-Éire theme sidecar for the DATUM for xBTC dashboard.
# Sits between the umbrel app_proxy and the DATUM gateway: it reverse-proxies the
# gateway's web UI (container xbtc-datum_datum_1:21009) and, on the fly, injects the
# Crypto-Éire stylesheet, swaps the DATUM logo for the crypto-eire mark, and rebrands
# the header wordmark. Static theme files are served from /theme/. Baked into the app so
# the branding survives app updates (unlike a hand-applied sidecar).
server {
    listen 80;
    server_name _;

    location /theme/ {
        alias /usr/share/nginx/theme/;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://xbtc-datum_datum_1:21009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # sub_filter only rewrites uncompressed responses.
        proxy_set_header Accept-Encoding "";
        proxy_redirect off;

        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '</head>' '<link rel="stylesheet" href="/theme/crypto-eire.css"></head>';
        sub_filter '/assets/icons/datum_logo.svg' '/theme/crypto-eire-icon.png';
        sub_filter 'DATUM <span>GATEWAY</span>' 'Crypto-Éire <span>xBTC</span>';
        sub_filter 'DATUM Gateway Status' 'Crypto-Éire xBTC — DATUM';
    }
}
