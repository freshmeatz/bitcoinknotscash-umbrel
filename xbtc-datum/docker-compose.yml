version: "3.7"

# DATUM gateway for Bitcoin Knots Cash (xBTC).
# Mirrors the working btc-datum app, repointed at the xbtc-node dependency.
# The bitcoind RPC (host/user/pass) is injected into datum_gateway_config.json by
# hooks/pre-start from the xbtc-node ("bitcoin") dependency's APP_BITCOIN_* vars, so
# it is NOT hardcoded here. The app frontend is the DATUM gateway's own dashboard (21009).

services:
  app_proxy:
    # Points at the Crypto-Éire theme sidecar (below), not the gateway directly, so the
    # dashboard is served with branding injected.
    environment:
      APP_HOST: xbtc-datum_theme_1
      APP_PORT: 80
    container_name: xbtc-datum_app_proxy_1

  datum:
    image: ghcr.io/horizon-btc/datum:v1.15-blake2b@sha256:e0d99c488dfca0401c19707e3f036b759ba6dd48223b5f0fc11029d2eaf9cf48
    entrypoint:
      - /app/datum_gateway
    command:
      - "--config=/app/conf/datum_gateway_config.json"
    user: "1000:1000"
    restart: on-failure
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ${APP_DATA_DIR}/data/settings/:/app/conf/
    ports:
      # Stratum endpoint your BLAKE2b miners connect to. Host port 23349 avoids clashing
      # with a btc-datum you may already run on 23333.
      - "23349:23333"
    container_name: xbtc-datum_datum_1

  # Crypto-Éire branding sidecar: reverse-proxies the DATUM dashboard and injects the
  # theme CSS + logo + header wordmark on the fly (see theme/nginx.conf). Baked into the
  # app so the branding survives updates, unlike a hand-applied sidecar.
  theme:
    image: nginx:1.27.3-alpine
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/theme/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_DATA_DIR}/theme/assets:/usr/share/nginx/theme:ro
    depends_on:
      - datum
    container_name: xbtc-datum_theme_1
